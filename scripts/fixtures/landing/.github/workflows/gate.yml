# The delivery gate — Handbook §26.
#
# THIS WORKFLOW IS THE PUBLICATION ORIGIN. Publishing from a branch means the push *is* the deploy
# and there is no point at which anything can refuse — which is the structural reason this class of
# work tends to have no verification at all: there would be nowhere to put it.
#
# So: set the repository's publishing source to GitHub Actions (or the equivalent on your host), and
# `publish` runs only after `gate` passes.
#
# §20's five stages are declared INAPPLICABLE for this class, by name and with the reason — there is
# no build, no type system, no unit suite and no dependency tree here. This replaces them. Dropping
# them silently is the failure the handbook names elsewhere.
#
# WHY EVERY CHECK RUNS EVEN AFTER ONE FAILS
#
# The first version of this file was one job of sequential steps, and the first failure hid the nine
# results after it. That turns one pass into a queue: fix, re-run, discover the next, re-run. A
# lint's output is input to the next turn (§20), and a report that stops at the first line is a
# worse input than one that lists everything wrong at once. So the checks run in two parallel jobs,
# every step is `if: '!cancelled()'`, and `gate` is the single thing to require in branch
# protection.
#
# TOOLING POLICY
#
# The site's own checks are Node stdlib, in `scripts/`, with no dependencies at all. Two external
# tools are pinned by exact version and fetched with `npx --yes`, the pattern the Central Standards
# CI already uses. Bumping one of these versions is a change with a proposal, not a convenience
# edit: §22 treats CI configuration as privileged surface.
#
# It was three. The accessibility CLI was removed after its first run on a real runner failed
# because the driver it bundles was tied to a Chrome the runner no longer had — see the note where
# it used to be. Pinning a tool without pinning the browser it drives is not a pin.

name: Delivery gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ the site's own rules
  # Seconds, no network, no dependencies. These are the rules no general-purpose tool knows about,
  # which is exactly why §20 says to promote a rule into code when documentation fails to hold it.
  checks:
    name: Site rules (§26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: The checks are the ones that were reviewed
        # Only present in a repository that ADOPTED the standard, where `scripts/` is a vendored copy
        # rather than the source. It is the cheap half of the same guarantee the test below gives:
        # the test says the checks WORK, this says they are the checks somebody agreed to. Editing
        # one under pressure to quiet a red gate then fails here, immediately and by name.
        #
        # Generate it at adoption: `sha256sum scripts/*.mjs > .github/handbook-scripts.sha256`.
        # A deliberate local fix to a check is legitimate — regenerate the file in the same commit
        # and record the divergence with the trigger to drop it.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f .github/handbook-scripts.sha256 ]; then
            sha256sum -c .github/handbook-scripts.sha256
          else
            echo "No digest file — this repository was built from the template rather than adopting into it."
          fi

      - name: The gate's own test
        # Runs first and asserts BOTH directions — a correct site passes every check, and each
        # deliberate defect is caught by the check that owns it. A check that has never failed on
        # purpose is not known to work; a check that fires on correct input teaches people to route
        # around the gate. This has already found four defects in the checks themselves.
        if: ${{ !cancelled() }}
        run: node scripts/test-gate.mjs

      - name: Detect the adoption baseline
        # WHICH MECHANISM HOLDS THE GATING AUTHORITY, and it can only be one of them.
        #
        # The three checks below and the ratchet are both present, and as ordinary steps the
        # stricter one wins. In a site built from this template that is invisible, because the three
        # pass. In a repository that ADOPTS they do not pass and will not until the baseline reaches
        # zero — so the job is red from day one and the ratchet decides nothing. The skill names the
        # outcome exactly: "a gate that fails on everything → red forever, switched off within a
        # week."
        #
        # So when a baseline exists, the three ratcheted checks report and the ratchet gates. Nothing
        # is silenced — every finding still prints in full on every run. What moves is authority.
        #
        # `build-derived --check` is deliberately NOT in this set, for the same reason `ratchet.mjs`
        # excludes it: a derived file drifting from its source is never something to carry, and
        # fixing it is one command. Neither is the internal-material step — contract-sensitive
        # findings are not ratchetable, and a site whose first run is red on a published brand
        # archive is the correct outcome.
        id: baseline
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f .gate-baseline.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A ratchet baseline is present, so check-config, check-markup and check-assets REPORT here and the ratchet step decides. Their findings are carried, not passing — read them, and lower the baseline in the same commit as any fix."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No baseline — this site is held to the rules in full."
          fi

      - name: One configuration module, no placeholders
        if: ${{ !cancelled() }}
        run: node scripts/check-config.mjs
        continue-on-error: ${{ steps.baseline.outputs.present == 'true' }}

      - name: Business facts derive from one source
        if: ${{ !cancelled() }}
        run: node scripts/build-derived.mjs --check

      - name: Indexability and the mobile render rules (§26, §6c)
        if: ${{ !cancelled() }}
        run: node scripts/check-markup.mjs
        continue-on-error: ${{ steps.baseline.outputs.present == 'true' }}

      - name: Byte budgets, orphans and third-party origins
        if: ${{ !cancelled() }}
        run: node scripts/check-assets.mjs
        continue-on-error: ${{ steps.baseline.outputs.present == 'true' }}

      - name: Nothing new (ratchet)
        # For a repository ADOPTING the standard with violations already present. It carries what
        # existed and fails on what is new, so the site stops getting worse on day one without the
        # gate reporting compliance it does not have.
        #
        # A site built from this template has no baseline and this is a no-op — which is correct: a
        # compliant site needs none, and recording a baseline of zero only invites raising it.
        if: ${{ !cancelled() }}
        run: node scripts/ratchet.mjs

      - name: No tracked secret or internal material (§4c)
        # The repository is the web root: a committed file is a published file. This is the last
        # line, not the mechanism — `.gitignore` is where the decision lives.
        #
        # ARCHIVES ARE IN THE PATTERN because an archive is the MOST LIKELY shape of exactly the
        # material this step exists to keep out: "send me the logos" produces a zip, and somebody
        # commits it beside the folder it came from. A live site was found publishing 583 KB of
        # brand archive at its URL, downloadable, while the loose `.ai` file next to it was caught.
        # Nothing can read inside an archive from here, so the extension is the whole signal.
        #
        # `downloads/` is the one carve-out, and it is a DECLARATION rather than an escape: putting
        # a file there says the publication is deliberate, in a directory whose name says so to the
        # next reader. Without it a site with a legitimate press kit has a permanently red gate and
        # no path back, which is how a gate stops being read.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if git ls-files | grep -Ev '^downloads/' | grep -Ei '\.(ai|psd|sketch|fig|env|pem|key|p12|pfx|zip|rar|7z|tar|tgz|gz)$|(^|/)(Branding|drafts|client)/'; then
            echo "::error::Internal material is tracked, and in this architecture tracked means published (Handbook §26). Remove it from git; if the exposure was real, rewriting history and rotating what it contained is the remediation, not a deletion commit. A file that is MEANT to be downloadable belongs in downloads/, which declares that."
            exit 1
          fi
          echo "OK — nothing internal is tracked."

  # ------------------------------------------------------------------ external tools, pinned
  # Minutes, and independent of the job above so a placeholder left in `config.js` never hides a
  # performance regression.
  external:
    name: Links, accessibility, performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Serve the site
        run: |
          python3 -m http.server 8080 --directory . &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ >/dev/null

      - name: Links resolve, including retired destinations
        if: ${{ !cancelled() }}
        run: |
          npx --yes linkinator@6.1.2 http://127.0.0.1:8080/ \
            --recurse \
            --skip '^https?://(?!127\.0\.0\.1)' \
            --verbosity error

      # NO SEPARATE ACCESSIBILITY STEP, and the reason is worth keeping.
      #
      # This job originally ran a pinned accessibility CLI, and on its first execution on a real
      # runner it failed for a reason that had nothing to do with the site: the CLI bundles a driver
      # tied to one Chrome version, the runner's Chrome had moved, and the step errored before
      # testing anything. A gate that goes red for reasons unrelated to the site is a gate people
      # switch off — the failure mode §20 warns about, arriving through the supply chain rather than
      # through a bad rule.
      #
      # Lighthouse's accessibility category IS axe-core, and it manages its own browser. So the
      # coverage moved there, backed by explicit assertions on the load-bearing audits rather than
      # by an aggregate score alone. What no tool covers — the keyboard walkthrough — stays in the
      # pull-request checklist, where it always was.

      - name: Detect the measurement record
        # Same shape as the count ratchet in the other job, for the same reason. An adopting site has
        # never been measured against these floors and will not reach them this week; the floors are
        # forbidden from being lowered, and correctly so — a loosened floor reads exactly like a
        # considered one. So when a record exists the floors REPORT and the measurement ratchet
        # gates, which is the only remaining option that neither lies nor blocks.
        id: measures
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [ -f .gate-measures.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A measurement record is present, so the Lighthouse floors REPORT here and ratchet-measures.mjs decides. The floors are unchanged and remain the target; what is carried is what this site has not reached yet."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mobile performance and accessibility thresholds
        # A threshold with no job that runs it produces the same software as no threshold. The
        # floors live in lighthouserc.json so a loosened one shows up in a diff and has to be
        # argued for.
        if: ${{ !cancelled() }}
        run: npx --yes @lhci/cli@0.14.0 autorun
        continue-on-error: ${{ steps.measures.outputs.present == 'true' }}

      - name: Nothing measurably worse (measurement ratchet)
        # Reads the reports the step above produced and compares them against `.gate-measures.json`,
        # within a per-metric tolerance so runner variance does not redden the gate. A metric that
        # has reached its floor is not carried here at all — it is held to the floor, which is
        # stricter. A site built from this template has no record and this is a no-op.
        if: ${{ !cancelled() }}
        run: node scripts/ratchet-measures.mjs

  # ------------------------------------------------------------------ the single required check
  gate:
    name: Delivery gate
    needs: [checks, external]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        run: |
          set -euo pipefail
          echo "site rules : ${{ needs.checks.result }}"
          echo "external   : ${{ needs.external.result }}"
          if [ "${{ needs.checks.result }}" != "success" ] || [ "${{ needs.external.result }}" != "success" ]; then
            echo "::error::The gate did not pass. Every failing check is listed in the two jobs above — fix them together rather than one per run."
            exit 1
          fi
          echo "Gate passed. Publication happens only from this workflow, never from a branch (§26)."

  # ------------------------------------------------------------------ publication
  publish:
    name: Publish
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The domain file must travel with the artifact. Moving the publication origin from a branch
      # to a workflow and omitting it unbinds the custom domain SILENTLY — the site keeps working on
      # the default host and the client's domain stops resolving (§26).
      - name: Assert the domain file is present
        run: |
          set -euo pipefail
          if [ -f CNAME ]; then
            echo "OK — CNAME travels with the artifact: $(cat CNAME)"
          else
            echo "::warning::No CNAME file. If this site has a custom domain, publishing from a workflow without it unbinds the domain silently."
          fi

      # THESE PINS ARE PROPOSED FOR UPDATE BY `.github/dependabot.yml`, NEVER AUTO-MERGED. §26
      # suspends §20's build-and-test stages and does NOT suspend its update policy — this is the
      # dependency tree this class of repository actually has, and two of these actions hold write
      # permission on the publication origin.
      #
      # READ THIS BEFORE ACCEPTING A MAJOR ON upload-pages-artifact. At v4 it stopped including
      # dotfiles in the artifact, and `.nojekyll` — staged deliberately a few lines above — is a
      # dotfile. Taking that upgrade at face value REMOVES A PUBLISHED FILE WITH A GREEN BUILD: the
      # artifact uploads, the deploy succeeds, and nothing in the pipeline or the gate says a word.
      # Later majors restore the choice as an input, so the bump is fine once the input is set and
      # silently destructive if it is not. Verify against the action's own release notes at the
      # moment you take it, not against this comment.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
