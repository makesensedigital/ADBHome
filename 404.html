<!-- ============================ MEASUREMENT — Google Tag Manager ============================
     The container fires Google Analytics 4 and Microsoft Clarity; neither has a snippet of its
     own here, both are dispatched from it. EVERY IDENTIFIER LIVES IN config.js, under `analytics`
     — naming them again here would be a second copy and three more gate findings, for nothing.
     Declared in privacy.html §2 and §5. Decided 2026-08-13 by Juan Torresel.

     THIS CONTAINER IS A SURFACE THE GATE CANNOT SEE, and that is the cost of the decision rather
     than an argument against it. A tag added in the Tag Manager UI reaches every visitor of this
     site with no commit, no diff, no review and no gate run. Everything else that executes here
     arrives through a pull request; this does not. Whoever holds container access holds publish
     rights over this domain. Debt D10.

     THE CONTAINER ID IS IN FOUR PLACES — config.js and the three documents — because the markup
     still does not read from the module (debt D2). Four copies, and check-config reports three of
     them, which is correct and is the finding rather than a defect in the check.

     WHY THE noscript IS AT THE START OF THE CONTENT AND NOT AFTER <body>: this document has no
     <body> tag. The markup is hand-written and goes straight from the head into the page, so the
     tag Google's instructions anchor to does not exist. The parser opens the element implicitly
     at the first content node, which is where the fragment below sits. -->
